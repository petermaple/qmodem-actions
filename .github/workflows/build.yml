name: Build QModem for ImmortalWrt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. 安装编译环境
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl libelf-dev

      # 2. 下载 ImmortalWrt 25.12.2 源码
      - name: Download ImmortalWrt source
        run: |
          git clone --depth 1 --branch v25.12.2 \
            https://github.com/immortalwrt/immortalwrt.git openwrt

      # 3. 添加 QModem 软件源
      - name: Add QModem feed
        run: |
          cd openwrt
          echo 'src-git qmodem https://github.com/FUjr/QModem.git;main' >> feeds.conf.default

      # 4. 更新并安装所有软件源
      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -p qmodem

      # 5. 配置编译目标
      - name: Configure target
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_PACKAGE_qmodem=m
          EOF
          make defconfig

      # 6. 提前下载 APK 源码，绕过原镜像 403
      - name: Download APK source
        run: |
          mkdir -p openwrt/dl
          curl -fL --retry 3 \
            https://sources.cdn.immortalwrt.org/apk-3.0.5.tar.zst \
            -o openwrt/dl/apk-3.0.5.tar.zst

      # 7. 编译主机工具
      - name: Build host tools
        run: |
          cd openwrt
          make tools/install -j2 V=s

      # 8. 编译目标工具链
      - name: Build toolchain
        run: |
          cd openwrt
          make toolchain/install -j2 V=s

      # 9. 编译 QModem
      - name: Compile QModem
        run: |
          cd openwrt
          make package/feeds/qmodem/qmodem/compile -j2 V=s

      # 10. 上传编译好的 APK
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: qmodem-immortalwrt-25.12.2-filogic
          path: openwrt/bin/packages/**/*.apk
          if-no-files-found: error
          retention-days: 7
