
name: Build QModem for ImmortalWrt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl libelf-dev

      - name: Download ImmortalWrt source
        run: |
          git clone --depth 1 --branch v25.12.2 \
            https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Add QModem feed
        run: |
          cd openwrt
          echo 'src-git qmodem https://github.com/FUjr/QModem.git;main' >> feeds.conf.default

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_PACKAGE_qmodem=m
          EOF
          make defconfig

      - name: Build host tools
        run: |
          cd openwrt
          make tools/install -j2 V=s

      - name: Build toolchain
        run: |
          cd openwrt
          make toolchain/install -j2 V=s

      - name: Compile QModem
        run: |
          cd openwrt
          make package/feeds/qmodem/qmodem/compile -j2 V=s

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: qmodem-immortalwrt-25.12.2-filogic
          path: openwrt/bin/packages/**/*.apk
          if-no-files-found: error
          retention-days: 7
